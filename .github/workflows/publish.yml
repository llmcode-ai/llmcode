name: Publish Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Compile
        run: npm run compile

      - name: Package extension
        run: npx @vscode/vsce package --no-dependencies --out llmcode.vsix

      # Publish using a Personal Access Token stored in the VSCE_PAT secret.
      # Create the publisher first and generate a PAT with Marketplace scope:
      #   https://marketplace.visualstudio.com/manage
      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --packagePath llmcode.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
