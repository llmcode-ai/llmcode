name: Publish Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Compile
        run: npm run compile

      # Trusted Publishing: exchanges a GitHub OIDC token for a short-lived
      # Marketplace credential. Requires a Trusted Publishing policy on the
      # publisher pointing at this repo + workflow (configured in the portal).
      - name: Publish to VS Code Marketplace (Trusted Publishing)
        run: npx --yes @vscode/vsce@4 publish --oidc
