name: Release & Publish Extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npx --yes @vscode/vsce@4 package --no-dependencies --out "llmcode-${{ github.ref_name }}.vsix"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LLMcode ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: "llmcode-${{ github.ref_name }}.vsix"
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to VS Code Marketplace (Trusted Publishing)
        id: publish
        run: |
          npx --yes @vscode/vsce@4 publish --oidc --packagePath "llmcode-${{ github.ref_name }}.vsix" > /tmp/publish.log 2>&1
          code=$?
          cat /tmp/publish.log
          cp /tmp/publish.log publish.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Publish fallback (PAT)
        if: failure() && env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@4 publish --packagePath "llmcode-${{ github.ref_name }}.vsix"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Save publish log for inspection
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@local"
          git fetch origin main
          git checkout main
          git add -f publish.log 2>/dev/null || true
          git commit -m "ci: publish log for ${{ github.ref_name }} [skip ci]" 2>/dev/null || true
          git push origin main || true
